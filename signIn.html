<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | RAW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Jost', 'ui-sans-serif', 'system-ui', 'sans-serif'] }, colors: { royal: '#4169e1' } } } };
    </script>
</head>
<body class="bg-white font-sans text-neutral-900 antialiased">
    <header class="mx-auto flex max-w-5xl items-center justify-between px-5 py-4">
        <a href="https://www.wix.com/" class="text-3xl font-bold tracking-tight" aria-label="Wix home">WIX</a>
        <a href="index.html" class="text-sm font-medium text-royal hover:underline"><i class="fa-solid fa-arrow-left mr-1" aria-hidden="true"></i>Back to store</a>
    </header>

    <main class="mx-auto max-w-4xl px-5 pb-10 pt-4">
        <div class="text-center">
            <h1 id="authTitle" class="text-3xl font-semibold sm:text-4xl">Sign Up</h1>
            <p class="mt-2 text-neutral-600"><span id="authPrompt">Already have an account?</span>
                <button type="button" id="authToggle" class="font-medium text-royal hover:underline">Log In</button></p>
        </div>

        <div class="mt-10 grid items-center gap-8 md:grid-cols-[1fr_auto_1fr]">
            <form id="authForm" class="mx-auto w-full max-w-sm space-y-4" novalidate>
                <div>
                    <label for="email" class="block text-sm font-medium">Email</label>
                    <input id="email" type="email" autocomplete="email" required class="mt-1 w-full rounded-md border border-neutral-300 bg-neutral-100 px-3 py-2.5 focus:border-royal focus:bg-white focus:outline-none focus:ring-2 focus:ring-royal/30">
                </div>
                <div data-signup-only>
                    <label for="email2" class="block text-sm font-medium">Confirm email</label>
                    <input id="email2" type="email" autocomplete="email" required class="mt-1 w-full rounded-md border border-neutral-300 bg-neutral-100 px-3 py-2.5 focus:border-royal focus:bg-white focus:outline-none focus:ring-2 focus:ring-royal/30">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium">Password</label>
                    <input id="password" type="password" autocomplete="new-password" minlength="6" required class="mt-1 w-full rounded-md border border-neutral-300 bg-neutral-100 px-3 py-2.5 focus:border-royal focus:bg-white focus:outline-none focus:ring-2 focus:ring-royal/30">
                </div>
                <div data-signup-only>
                    <label for="password2" class="block text-sm font-medium">Confirm password</label>
                    <input id="password2" type="password" autocomplete="new-password" minlength="6" required class="mt-1 w-full rounded-md border border-neutral-300 bg-neutral-100 px-3 py-2.5 focus:border-royal focus:bg-white focus:outline-none focus:ring-2 focus:ring-royal/30">
                </div>
                <p id="authMsg" class="min-h-5 text-sm" role="status" aria-live="polite"></p>
                <button type="submit" id="authSubmit" class="w-full rounded-full bg-royal py-3 font-semibold text-white transition hover:bg-blue-900">Sign Up</button>
            </form>

            <div class="flex items-center gap-3 text-sm font-semibold text-neutral-500 md:h-72 md:flex-col" aria-hidden="true">
                <span class="h-px flex-1 bg-neutral-300 md:h-auto md:w-px"></span>or<span class="h-px flex-1 bg-neutral-300 md:h-auto md:w-px"></span>
            </div>

            <div class="mx-auto flex w-full max-w-sm flex-col gap-4">
                <a href="#" class="flex items-center justify-center gap-3 rounded-md border border-neutral-300 bg-white px-4 py-3 font-medium transition hover:bg-neutral-50">
                    <i class="fa-brands fa-google text-lg" aria-hidden="true"></i> Continue with Google
                </a>
                <a href="#" class="flex items-center justify-center gap-3 rounded-md border border-neutral-300 bg-white px-4 py-3 font-medium transition hover:bg-neutral-50">
                    <i class="fa-brands fa-facebook-f text-lg text-[#1877f2]" aria-hidden="true"></i> Continue with Facebook
                </a>
            </div>
        </div>
    </main>

    <footer class="mx-auto max-w-2xl space-y-2 px-5 pb-10 text-center text-xs text-neutral-500">
        <p>* By signing up, you agree to our Terms of Use and acknowledge you&rsquo;ve read our Privacy Policy.</p>
        <p>This site is protected by reCAPTCHA Enterprise. Google&rsquo;s Privacy Policy and Terms of Service apply.</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
