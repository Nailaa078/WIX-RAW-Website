<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--   Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- css style sheet -->
    <link rel="stylesheet" href="signIn.css">
    <title>signin</title>
</head>

<body>
    <!-- nav bar icon -->
    <div class="top-left">
        <a href="https://www.wix.com/">
            <h1 class="logo">WIX</h1>
        </a>
    </div>
    <!-- sign in part -->
    <div class="signin">

        <h1 class="signinHeading">Sign Up</h1>
        <span>
            <p class="signinDetail">Already have an account? <a href="#" class="login"> Log In</a></p>
        </span>
    </div>
    <!-- Body Part -->

    <div class="body">
        <!-- Left Side -->
        <form>
            <div class="input-box d-flex flex-column gap-1">
                <label for="user-mail">Email:</label>
                <input type="email" class="bg-secondary-subtle" required>
                <label for="user-mail">Confirm Email:</label>
                <input type="email" class="bg-secondary-subtle" required>
                <label for="user-password">Choose Password:</label>
                <input type="password" class="bg-secondary-subtle" required>
                <label for="user-password">Confirm Password:</label>
                <input type="password" class="bg-secondary-subtle" required>
                <button class=" border border-secondary-subtle rounded-pill p-1 mt-3">Sign Up</button>
            </div>
        </form>
        <!-- divider -->
        <div class="divider">
            <span> or </span>
        </div>
        <!-- Right Side -->
        <div class="social-accounts">
            <!-- Google -->
            <a class="ref" href="#">
                <span class="icons">
                    <i class="fa-brands fa-google"></i>
                </span>
                <span class="label">Continue with Google</span>
            </a>
            <!-- facebook -->
            <a class=" ref" href="#">
                <span class="icons">
                    <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
                </span>
                <span class="label">Continue with Facebook</span>
            </a>
        </div>
    </div>
    <!-- Footer -->
     <footer>
        <p class="footer-Para">* By signing up, you agree to our Terms of Use and acknowledge you’ve read our Privacy Policy.</p>
        <p class="footer-Para">This site is protected by reCAPTCHA Enterprise. Google's Privacy Policy and Terms of Service apply.</p>
     </footer>
</body>

</html>
